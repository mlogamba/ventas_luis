# GitHub → Apps Script: ad ogni push su main che tocca src/ aggiorna lo script e la distribuzione web (URL /exec invariato)
name: Deploy to Apps Script
on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

concurrency:
  group: gas-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @google/clasp@2.4.2
      - name: Credenziali clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"src\",\"fileExtension\":\"gs\"}" > .clasp.json
      - name: Push del codice
        run: clasp push --force
      - name: Aggiorna la distribuzione web (stesso URL)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
